<html>
    <head>
        <title>Interactive Scoreboard</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="scoreboard">
            <div class="teams-container">
            <div class="team home">
                <div class="team-name">HOME</div>
                <div class="score-display" id="home-score">00</div>
                <button onclick="changeScore('home', 1)">+1</button>
                <button onclick="changeScore('home', 2)">+2</button>
                <button onclick="changeScore('home', 3)">+3</button>
                <button onclick="changeScore('home', -1)">-1</button></div>
            <div class="team away">
                <div class="team-name">AWAY</div>
                <div class="score-display" id="away-score">00</div>
                <button onclick="changeScore('away', 1)">+1</button>
                <button onclick="changeScore('away', 2)">+2</button>
                <button onclick="changeScore('away', 3)">+3</button>
                <button onclick="changeScore('away', -1)">-1</button></div>
        </div>
        <button class="reset-btn" onclick="resetScoreboard()">New Game</button>
    </div>
        <script src="index.js"></script>
    </body>
</html>
